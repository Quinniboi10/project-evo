<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Project Evo</title>

    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #101722;
            color: #e2e8f0;
            font: 15px system-ui, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        header { padding: 20px 24px 12px; }
        h1 { font-size: 23px; margin: 0 0 8px; font-weight: 600; }
        #summary, #live-status { color: #aab8cd; line-height: 1.5; }

        .toolbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 12px;
            align-items: center;
        }

        .timeline { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 220px; }
        #step { flex: 1; min-width: 80px; accent-color: #34d399; }
        #step-label { min-width: 7ch; text-align: right; font-variant-numeric: tabular-nums; }
        .view-controls { display: flex; gap: 10px; margin-left: auto; }

        button {
            background: #233047;
            color: #e2e8f0;
            border: 1px solid #51627a;
            border-radius: 6px;
            padding: 8px 12px;
            font: inherit;
            cursor: pointer;
        }

        button:hover:not(:disabled) { background: #30415c; }
        button:focus-visible { outline: 2px solid #34d399; outline-offset: 3px; }
        button:disabled { opacity: 0.5; cursor: default; }

        #island-overview { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 4px; }
        #island-overview[hidden] { display: none; }
        .island-card { flex-shrink: 0; text-align: left; border-top: 3px solid var(--island-color, #94a3b8); }
        .island-card[aria-pressed="true"] { background: #30415c; outline: 1px solid #e2e8f0; }
        .island-card small { display: block; color: #aab8cd; margin-top: 4px; }
        #graph-container { position: relative; flex: 1; min-height: 0; }
        #inspiration-overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; }
        #legend { color: #aab8cd; font-size: 12px; margin-top: 8px; }
        #graph {
            width: 100%;
            height: 100%;
        }

        #node-popup {
            position: fixed;
            z-index: 10;
            max-width: min(360px, calc(100vw - 32px));
            white-space: normal;
            overflow-wrap: anywhere;
            padding: 10px 12px;
            background: #233047;
            color: #e2e8f0;
            border: 1px solid #51627a;
            border-radius: 6px;
            font: 14px/1.5 system-ui, sans-serif;
            box-shadow: 0 8px 24px #0006;
        }
        #node-popup button { margin-top: 8px; }
        dialog { width: min(800px, calc(100vw - 64px)); max-height: 80vh; background: #182233; color: #e2e8f0; border: 1px solid #51627a; border-radius: 8px; }
        dialog::backdrop { background: #0008; }
        .dialog-heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
        .dialog-heading h2 { margin: 0; font-size: 20px; }
        #row-values { white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.6 monospace; }
    </style>
</head>

<body>
    <header>
        <h1>Project Evo · exploration tree</h1>
        <div id="summary" role="status">Loading graph…</div>
        <div id="live-status">OFFLINE - Last updated: never</div>
        <div id="island-overview" role="group" aria-label="Island filter" hidden></div>
        <div id="legend">Diamond: best attempt · Green edges: best ancestry · Dashed arrows: inspiration · Rings: inspiration sources</div>
        <div class="toolbar" role="group" aria-label="Graph navigation">
            <div class="timeline">
                <button id="replay" type="button" disabled>Replay</button>
                <label for="step">Attempt</label>
                <input id="step" type="range" min="0" max="0" value="0" step="1" disabled>
                <output id="step-label" for="step">0 / 0</output>
            </div>
            <div class="view-controls">
                <button id="fit" type="button" disabled>Fit all</button>
                <button id="best" type="button" disabled>Focus best</button>
            </div>
        </div>
    </header>
    <div id="graph-container">
        <div id="graph"></div>
        <svg id="inspiration-overlay" aria-hidden="true"></svg>
    </div>

    <div id="node-popup" hidden>
        <strong id="popup-name"></strong>
        <div id="popup-score"></div>
        <div id="popup-island"></div>
        <div id="popup-inspirations"></div>
        <button id="show-row" type="button">Show all values</button>
    </div>
    <dialog id="row-dialog" aria-labelledby="row-heading">
        <div class="dialog-heading">
            <h2 id="row-heading">Row data</h2>
            <button id="close-row" type="button">Close</button>
        </div>
        <pre id="row-values" aria-live="polite"></pre>
        <button id="retry-row" type="button" hidden>Retry</button>
    </dialog>

    <script>
        let network = null;
        let nodes;
        let edges;
        let best = null;
        let selectedNodeId = null;
        let hoveredNodeId = null;
        let lastSnapshot = null;
        let lastUpdated = null;
        let isLive = false;
        let fullGraph = { nodes: [], edges: [] };
        let selectedIsland = null;
        let timelineNodes = [];
        const islandColors = ["#60a5fa", "#c084fc", "#fb923c", "#2dd4bf", "#f472b6", "#a3e635", "#facc15", "#818cf8"];
        const overlay = document.getElementById("inspiration-overlay");
        const overview = document.getElementById("island-overview");
        let pendingGraph = null;
        let replayTimer = null;
        const step = document.getElementById("step");
        const replayButton = document.getElementById("replay");

        const popup = document.getElementById("node-popup");
        const rowDialog = document.getElementById("row-dialog");
        let popupNodeId = null;
        let popupTimer = null;
        let rowRequest = null;
        let rowId = null;

        function hidePopup() {
            clearTimeout(popupTimer);
            popup.hidden = true;
            overlay.replaceChildren();
            popupNodeId = null;
            hoveredNodeId = null;
            if (network) updateSelection();
        }

        function schedulePopupHide() {
            clearTimeout(popupTimer);
            popupTimer = setTimeout(() => {
                if (!popup.matches(":hover") && !popup.contains(document.activeElement)) hidePopup();
            }, 350);
        }

        function showPopup(id, point) {
            const node = fullGraph.nodes.find(node => node.id === id);
            if (!node) return;
            clearTimeout(popupTimer);
            popupNodeId = id;
            document.getElementById("popup-name").textContent = `#${id} · ${node.name}`;
            document.getElementById("popup-score").textContent = `Score: ${node.score.toLocaleString("en-US", { maximumSignificantDigits: 21 })}`;
            document.getElementById("popup-island").textContent = islandLabel(node);
            const references = node.inspiration_ids;
            document.getElementById("popup-inspirations").textContent = references === null || references === undefined
                ? "Inspiration history unavailable"
                : references.length ? `Inspired by ${references.map(id => `#${id}`).join(", ")}` : "No inspiration references";
            popup.hidden = false;
            drawInspirations();
            const bounds = document.getElementById("graph").getBoundingClientRect();
            const x = bounds.left + point.x;
            const y = bounds.top + point.y;
            popup.style.left = `${Math.max(8, Math.min(x + 14, innerWidth - popup.offsetWidth - 8))}px`;
            popup.style.top = `${Math.max(8, Math.min(y + 14, innerHeight - popup.offsetHeight - 8))}px`;
        }

        popup.addEventListener("mouseenter", () => clearTimeout(popupTimer));
        popup.addEventListener("mouseleave", schedulePopupHide);
        popup.addEventListener("focusin", () => clearTimeout(popupTimer));
        popup.addEventListener("focusout", schedulePopupHide);
        window.addEventListener("resize", hidePopup);
        document.addEventListener("keydown", event => {
            if (event.key === "Escape") hidePopup();
        });

        async function loadRow(id) {
            rowRequest?.abort();
            const request = new AbortController();
            rowRequest = request;
            const timeout = setTimeout(() => request.abort(), 10000);
            const values = document.getElementById("row-values");
            const retry = document.getElementById("retry-row");
            values.textContent = "Loading…";
            retry.hidden = true;
            try {
                const response = await fetch(`/api/row/${encodeURIComponent(id)}`, {
                    cache: "no-store", signal: request.signal
                });
                if (!response.ok) throw new Error("Row request failed");
                const row = await response.json();
                if (rowRequest === request && rowDialog.open) {
                    values.textContent = JSON.stringify(row, null, 2);
                }
            } catch {
                if (rowRequest === request && rowDialog.open) {
                    values.textContent = "Could not load this row. Please try again.";
                    retry.hidden = false;
                }
            } finally {
                clearTimeout(timeout);
            }
        }

        document.getElementById("show-row").onclick = () => {
            if (popupNodeId === null) return;
            rowId = popupNodeId;
            hidePopup();
            document.getElementById("row-heading").textContent = `Row #${rowId} · All values`;
            rowDialog.showModal();
            loadRow(rowId);
        };
        document.getElementById("retry-row").onclick = () => loadRow(rowId);
        document.getElementById("close-row").onclick = () => rowDialog.close();
        rowDialog.addEventListener("close", () => {
            rowRequest?.abort();
            rowRequest = null;
        });

        function updateSelection() {
            const activeNodeId = hoveredNodeId ?? selectedNodeId;
            if (activeNodeId === null) {
                network.unselectAll();
                drawInspirations();
                return;
            }
            const visibleEdges = edges.get();
            const parents = new Map(visibleEdges.map(edge => [edge.to, edge]));
            const highlightedNodes = new Set([activeNodeId]);
            const highlightedEdges = new Set();
            let ancestor = activeNodeId;
            while (parents.has(ancestor)) {
                const edge = parents.get(ancestor);
                if (highlightedNodes.has(edge.from)) break;
                highlightedEdges.add(edge.id);
                highlightedNodes.add(edge.from);
                ancestor = edge.from;
            }
            for (const edge of visibleEdges) {
                if (edge.from === activeNodeId) {
                    highlightedNodes.add(edge.to);
                    highlightedEdges.add(edge.id);
                }
            }
            network.setSelection({
                nodes: [...highlightedNodes],
                edges: [...highlightedEdges]
            }, { highlightEdges: false });
            drawInspirations();
        }

        function islandColor(id) {
            return islandColors[id % islandColors.length];
        }

        function islandLabel(node) {
            const ids = node.island_ids ?? [];
            return ids.length > 1 ? "Shared baseline · all islands"
                : ids.length ? `Island ${ids[0]}` : "";
        }

        function updateOverview() {
            const islands = [...(fullGraph.islands ?? [])].sort((a, b) => a - b);
            overview.hidden = islands.length === 0;
            const existing = new Map([...overview.children].map(button => [button.dataset.island, button]));
            const parentIds = new Set(fullGraph.edges.map(edge => edge.to));
            for (const island of [null, ...islands]) {
                const key = island === null ? "all" : String(island);
                let button = existing.get(key);
                if (!button) {
                    button = document.createElement("button");
                    button.type = "button";
                    button.className = "island-card";
                    button.dataset.island = key;
                    button.append(document.createElement("strong"), document.createElement("small"));
                    button.onclick = () => {
                        stopReplay();
                        selectedIsland = island;
                        hidePopup();
                        showAttempt();
                        if (network) network.fit({ animation: true });
                    };
                    overview.append(button);
                }
                existing.delete(key);
                button.style.setProperty("--island-color", island === null ? "#94a3b8" : islandColor(island));
                button.setAttribute("aria-pressed", String(selectedIsland === island));
                button.firstChild.textContent = island === null ? "All islands" : `Island ${island}`;
                const members = timelineNodes.filter(node => island === null || node.island_ids?.includes(island));
                const attempts = members.filter(node => parentIds.has(node.id)).length;
                const champion = members.reduce((best, node) => !best || node.score > best.score ? node : best, null);
                const baseline = members.find(node => !parentIds.has(node.id));
                const improvement = champion && baseline ? ` · ${(champion.score / baseline.score).toFixed(2)}× baseline` : "";
                button.lastChild.textContent = `${attempts ? `${attempts} successful attempts` : "No successful attempts yet"}${champion ? ` · best ${champion.score_label}${improvement}` : ""}`;
            }
            for (const button of existing.values()) button.remove();
        }

        function drawInspirations() {
            overlay.replaceChildren();
            const activeNodeId = popupNodeId ?? selectedNodeId;
            if (!network || activeNodeId === null) return;
            const target = timelineNodes.find(node => node.id === activeNodeId);
            if (!target || !target.inspiration_ids?.length || !nodes.get(target.id)) return;
            const svgElement = (tag, attributes, text) => {
                const element = document.createElementNS("http://www.w3.org/2000/svg", tag);
                for (const [name, value] of Object.entries(attributes)) element.setAttribute(name, String(value));
                if (text !== undefined) element.textContent = text;
                return element;
            };
            const defs = svgElement("defs", {});
            const marker = svgElement("marker", { id: "inspiration-arrow", viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 6, markerHeight: 6, orient: "auto-start-reverse" });
            marker.append(svgElement("path", { d: "M 0 0 L 10 5 L 0 10 z", fill: "#e2e8f0" }));
            defs.append(marker);
            overlay.append(defs);
            const targetPoint = network.canvasToDOM(network.getPositions([target.id])[target.id]);
            const available = new Map(timelineNodes.map(node => [node.id, node]));
            const references = target.inspiration_ids.map(id => available.get(id)).filter(Boolean);
            const outsiders = references.filter(reference => !nodes.get(reference.id));
            const width = overlay.clientWidth;
            const height = overlay.clientHeight;
            const cardWidth = Math.min(220, Math.max(100, width - 16));
            const ghostX = Math.max(8, Math.min(width - cardWidth - 8, targetPoint.x > width / 2 ? targetPoint.x - cardWidth - 90 : targetPoint.x + 90));
            const spacing = Math.min(58, Math.max(24, (height - 16) / Math.max(1, outsiders.length)));
            const top = Math.max(8, Math.min(height - outsiders.length * spacing - 8, targetPoint.y - outsiders.length * spacing / 2));
            const cards = [];
            for (const reference of references) {
                let source;
                if (nodes.get(reference.id)) {
                    source = network.canvasToDOM(network.getPositions([reference.id])[reference.id]);
                    overlay.append(svgElement("circle", {
                        cx: source.x, cy: source.y, r: (nodes.get(reference.id).size + 3) * network.getScale() + 5,
                        fill: "none", stroke: "#fbbf24", "stroke-width": 2, "data-source-id": reference.id
                    }));
                } else {
                    const y = top + outsiders.indexOf(reference) * spacing;
                    source = { x: ghostX + cardWidth / 2, y: y + 23 };
                    cards.push({ reference, y });
                }
                const dx = targetPoint.x - source.x;
                const dy = targetPoint.y - source.y;
                const distance = Math.max(1, Math.hypot(dx, dy));
                overlay.append(svgElement("line", {
                    x1: source.x, y1: source.y,
                    x2: targetPoint.x - dx / distance * 18, y2: targetPoint.y - dy / distance * 18,
                    stroke: "#e2e8f0", "stroke-width": 2, "stroke-dasharray": "6 5", "marker-end": "url(#inspiration-arrow)"
                }));
            }
            for (const { reference, y } of cards) {
                const group = svgElement("g", { "data-reference-id": reference.id });
                const color = reference.island_ids?.length === 1 ? islandColor(reference.island_ids[0]) : "#94a3b8";
                group.append(svgElement("rect", { x: ghostX, y, width: cardWidth, height: 46, rx: 6, fill: "#182233", stroke: color, "stroke-width": 2 }));
                group.append(svgElement("circle", { cx: ghostX + 13, cy: y + 15, r: 6, fill: "none", stroke: "#fbbf24", "stroke-width": 2, "data-source-id": reference.id }));
                group.append(svgElement("text", { x: ghostX + 26, y: y + 18, fill: "#e2e8f0", "font-size": 13 }, `#${reference.id} · ${islandLabel(reference)}`));
                group.append(svgElement("text", { x: ghostX + 10, y: y + 36, fill: "#aab8cd", "font-size": 12 }, `Score: ${reference.score_label} · inspiration`));
                overlay.append(group);
            }
        }

        function showAttempt() {
            hidePopup();
            timelineNodes = fullGraph.nodes.slice(0, Number(step.value) + 1);
            const visibleNodes = timelineNodes.filter(node => selectedIsland === null || node.island_ids?.includes(selectedIsland));
            const visibleIds = new Set(visibleNodes.map(node => node.id));
            document.getElementById("step-label").textContent = `${step.value} / ${step.max}`;
            updateOverview();
            renderGraph({
                nodes: visibleNodes,
                edges: fullGraph.edges.filter(edge => visibleIds.has(edge.from) && visibleIds.has(edge.to))
            });
        }

        function receiveGraph(graph) {
            hidePopup();
            // Keep a replay's timeline fixed while live snapshots arrive.
            if (replayTimer !== null) {
                pendingGraph = graph;
                return;
            }
            const followLatest = !fullGraph.nodes.length || Number(step.value) === Number(step.max);
            const viewedId = fullGraph.nodes[Number(step.value)]?.id;
            fullGraph = { ...graph, nodes: [...graph.nodes].sort((a, b) => a.id - b.id) };
            if (selectedIsland !== null && !fullGraph.islands?.includes(selectedIsland)) selectedIsland = null;
            step.max = Math.max(0, fullGraph.nodes.length - 1);
            const viewedIndex = fullGraph.nodes.findIndex(node => node.id === viewedId);
            step.value = followLatest ? step.max : Math.max(0, viewedIndex);
            step.disabled = replayButton.disabled = fullGraph.nodes.length < 2;
            showAttempt();
        }

        function stopReplay() {
            clearInterval(replayTimer);
            replayTimer = null;
            replayButton.textContent = "Replay";
            if (pendingGraph) {
                const graph = pendingGraph;
                pendingGraph = null;
                receiveGraph(graph);
            }
        }

        step.addEventListener("input", () => {
            stopReplay();
            showAttempt();
        });
        replayButton.onclick = () => {
            if (replayTimer !== null) {
                stopReplay();
                return;
            }
            if (fullGraph.nodes.length < 2) return;
            hidePopup();
            step.value = 0;
            showAttempt();
            replayButton.textContent = "Pause";
            const started = performance.now();
            const finalStep = Number(step.max);
            replayTimer = setInterval(() => {
                const elapsed = Math.min(10, (performance.now() - started) / 1000);
                // Two-second speed ramps, with steady speed for the middle six seconds.
                // The area under this speed curve is eight, normalizing progress to 0–1.
                const progress = elapsed < 2
                    ? elapsed * elapsed / 32
                    : elapsed > 8
                        ? 1 - (10 - elapsed) ** 2 / 32
                        : (elapsed - 1) / 8;
                const nextStep = Math.floor(progress * finalStep);
                if (nextStep !== Number(step.value)) {
                    step.value = nextStep;
                    showAttempt();
                }
                if (progress === 1) stopReplay();
            }, 50);
        };

        function formatTime(timeInMS) {
            let seconds = Math.max(0, Math.floor(timeInMS / 1000));
            const days = Math.floor(seconds / 86400);
            seconds %= 86400;
            const hours = Math.floor(seconds / 3600);
            seconds %= 3600;
            const minutes = Math.floor(seconds / 60);
            seconds %= 60;

            const parts = [];
            if (days > 0) parts.push(`${days}d`);
            if (hours > 0) parts.push(`${hours}h`);
            if (minutes > 0 || hours > 0) parts.push(`${minutes}m`);
            if (seconds > 0 || minutes > 0 || hours > 0) parts.push(`${seconds}s`);
            return parts.length ? parts.join(" ") : "0s";
        }

        function updateLiveStatus() {
            const elapsed = lastUpdated === null
                ? "Last updated: never"
                : `Last updated ${formatTime(Date.now() - lastUpdated)} ago`;
            document.getElementById("live-status").textContent =
                isLive ? "LIVE - updates every 10s" : `OFFLINE - ${elapsed}`;
        }

        function islandPositions() {
            const positions = new Map();
            let top = 0;
            // Use the complete snapshot so replay reveals nodes without reordering islands.
            for (const island of [...(fullGraph.islands ?? [])].sort((a, b) => a - b)) {
                const levels = new Map();
                for (const node of fullGraph.nodes) {
                    if (node.level === 0 || node.island_ids?.length !== 1 || node.island_ids[0] !== island) continue;
                    if (!levels.has(node.level)) levels.set(node.level, []);
                    levels.get(node.level).push(node);
                }
                const rows = Math.max(1, ...[...levels.values()].map(layer => layer.length));
                for (const [level, layer] of levels) {
                    layer.sort((a, b) => a.id - b.id);
                    layer.forEach((node, index) => positions.set(node.id, {
                        x: level * 230, y: top + (rows - layer.length) * 50 + index * 100
                    }));
                }
                top += rows * 100 + 100;
            }
            for (const node of fullGraph.nodes) {
                if (!positions.has(node.id)) positions.set(node.id, { x: node.level * 230, y: Math.max(0, top - 200) / 2 });
            }
            return positions;
        }

        function renderGraph(graph) {

            best = graph.nodes.reduce((best, node) =>
                Number.isFinite(node.score) && (!best || node.score > best.score)
                    ? node : best, null);
            const parents = new Map(graph.edges.map(edge => [edge.to, edge.from]));
            const roots = graph.nodes.filter(node => !parents.has(node.id));
            const baseline = roots.length === 1 ? roots[0] : null;
            const ratio = best && baseline && baseline.score !== 0
                ? best.score / baseline.score : NaN;
            const comparison = Number.isFinite(ratio)
                ? ` (${ratio.toFixed(2)}× baseline)` : "";
            const attempts = graph.nodes.length - roots.length;
            const parentsExplored = new Set(graph.edges.map(edge => edge.from)).size;
            document.getElementById("summary").textContent = graph.nodes.length
                ? `${attempts} successful attempts · ${best ? `best #${best.id}: ${best.score_label} score${comparison}` : "No scored candidates"} · ${parentsExplored} parents explored`
                : "Waiting for the first candidate";
            const bestPath = new Set();
            let ancestor = best?.id;
            while (ancestor !== undefined && !bestPath.has(ancestor)) {
                bestPath.add(ancestor);
                ancestor = parents.get(ancestor);
            }

            const orderedIslands = Boolean(fullGraph.islands?.length);
            const positions = orderedIslands ? islandPositions() : new Map();
            const nextNodes = graph.nodes.map(node => {
                const isBest = node.id === best?.id;
                const onPath = bestPath.has(node.id);
                return {
                    id: node.id,
                    level: node.level,
                    ...positions.get(node.id),
                    fixed: orderedIslands,
                    label: `#${node.id} · ${node.score_label}`,
                    shape: isBest ? "diamond" : "dot",
                    size: isBest ? 19 : onPath ? 15 : 11,
                    color: {
                        background: node.island_ids?.length === 1 ? islandColor(node.island_ids[0]) : "#94a3b8",
                        border: isBest ? "#fbbf24" : onPath ? "#34d399" : "#51627a"
                    },
                    borderWidth: isBest ? 4 : 2
                };
            });
            const nextEdges = graph.edges.map(edge => ({
                id: JSON.stringify([edge.from, edge.to]),
                from: edge.from,
                to: edge.to,
                color: {
                    color: bestPath.has(edge.to) ? "#34d399" : "#42536b",
                    inherit: false
                },
                width: bestPath.has(edge.to) ? 4 : 1.5
            }));

            document.getElementById("fit").disabled = graph.nodes.length === 0;
            document.getElementById("best").disabled = best === null;

            if (network) {
                const position = network.getViewPosition();
                const scale = network.getScale();
                const rootBefore = baseline && nodes.get(baseline.id)
                    ? network.getPositions([baseline.id])[baseline.id] : null;
                const nodeIds = new Set(nextNodes.map(node => node.id));
                const edgeIds = new Set(nextEdges.map(edge => edge.id));
                edges.remove(edges.getIds().filter(id => !edgeIds.has(id)));
                nodes.remove(nodes.getIds().filter(id => !nodeIds.has(id)));
                network.setOptions({ layout: { hierarchical: { enabled: !orderedIslands } } });
                nodes.update(nextNodes);
                edges.update(nextEdges);
                if (!nodeIds.has(selectedNodeId)) selectedNodeId = null;
                if (!nodeIds.has(hoveredNodeId)) hidePopup();
                updateSelection();
                if (rootBefore) {
                    // Let the visible tree reflow, but keep its root at the same screen pixel.
                    const rootAfter = network.getPositions([baseline.id])[baseline.id];
                    position.x += rootAfter.x - rootBefore.x;
                    position.y += rootAfter.y - rootBefore.y;
                }
                network.moveTo({ position, scale, animation: false });
                return;
            }

            nodes = new vis.DataSet(nextNodes);
            edges = new vis.DataSet(nextEdges);
            const data = {
                nodes: nodes,
                edges: edges
            };

            const options = {
                layout: {
                    hierarchical: {
                        enabled: !orderedIslands,
                        direction: "LR",
                        levelSeparation: 230,
                        nodeSpacing: 100,
                        sortMethod: "directed"
                    }
                },

                physics: false,

                nodes: {
                    shape: "dot",
                    size: 11,
                    color: "#94a3b8",
                    borderWidth: 2,
                    borderWidthSelected: 2,
                    chosen: {
                        node(values, id, selected, hovering) {
                            if (selected || hovering) {
                                values.borderColor = "#e2e8f0";
                                if (hoveredNodeId !== null) values.size += 2;
                            }
                        },
                        label: false
                    },
                    font: {
                        color: "#e2e8f0",
                        size: 16
                    }
                },

                edges: {
                    arrows: "to",
                    color: { color: "#42536b", inherit: false },
                    width: 1.5,
                    smooth: {
                        enabled: true,
                        type: "cubicBezier",
                        forceDirection: "horizontal"
                    }
                },

                interaction: {
                    hover: true
                }
            };

            network = new vis.Network(
                document.getElementById("graph"),
                data,
                options
            );

            network.on("afterDrawing", drawInspirations);
            network.on("hoverNode", ({ node, pointer }) => {
                hoveredNodeId = node;
                updateSelection();
                showPopup(node, pointer.DOM);
            });
            network.on("blurNode", schedulePopupHide);
            network.on("dragStart", hidePopup);
            network.on("zoom", hidePopup);
            network.on("click", ({ pointer }) => {
                const clickedNodeId = network.getNodeAt(pointer.DOM);
                hidePopup();
                if (clickedNodeId === undefined || clickedNodeId === selectedNodeId) {
                    selectedNodeId = null;
                } else {
                    selectedNodeId = clickedNodeId;
                }
                updateSelection();
            });

            const fitButton = document.getElementById("fit");
            const bestButton = document.getElementById("best");
            fitButton.onclick = () => network.fit({ animation: true });
            bestButton.onclick = () => {
                if (!best) return;
                hoveredNodeId = null;
                selectedNodeId = best.id;
                updateSelection();
                network.focus(best.id, {
                    scale: 1,
                    animation: { duration: 350 }
                });
            };
        }

        async function refreshGraph() {
            try {
                const response = await fetch("/api/graph", {
                    cache: "no-store",
                    signal: AbortSignal.timeout(10000)
                });
                if (!response.ok) throw new Error(`Graph request failed: ${response.status}`);
                const graph = await response.json();
                if (!Array.isArray(graph.nodes) || !Array.isArray(graph.edges)) {
                    throw new Error("Invalid graph response");
                }
                const snapshot = JSON.stringify(graph);
                hidePopup();
                if (snapshot !== lastSnapshot) {
                    receiveGraph(graph);
                    lastSnapshot = snapshot;
                }
                lastUpdated = Date.now();
                isLive = true;
            } catch {
                isLive = false;
                // Keep the last successful graph and retry without interrupting navigation.
                if (!network) {
                    document.getElementById("summary").textContent = "Waiting for server…";
                }
            } finally {
                updateLiveStatus();
                // Schedule after completion so slow requests never overlap.
                setTimeout(refreshGraph, 10000);
            }
        }

        setInterval(updateLiveStatus, 1000);
        refreshGraph();
    </script>
</body>
</html>
